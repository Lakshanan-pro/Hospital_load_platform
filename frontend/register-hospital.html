<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Registration Request</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 600px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header .icon {
      font-size: 4em;
      margin-bottom: 10px;
    }

    .header h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2em;
    }

    .header p {
      color: #666;
      font-size: 0.95em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 0.9em;
    }

    label .required {
      color: #dc3545;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      margin-top: 10px;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .info-box {
      background: #e7f3ff;
      border: 1px solid #b3d9ff;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 0.85em;
      color: #004085;
    }

    .info-box strong {
      display: block;
      margin-bottom: 5px;
    }

    .nav-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #667eea;
      text-decoration: none;
      font-size: 0.9em;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">🏥</div>
      <h1>Hospital Registration</h1>
      <p>Request access to manage your hospital's crowd status</p>
    </div>

    <div id="alert" class="alert"></div>

    <div class="info-box">
      <strong>ℹ️ Registration Process</strong>
      Your registration request will be reviewed by an administrator. You will be able to login only after your request is approved.
    </div>

    <form id="registrationForm">
      <div class="form-group">
        <label for="hospital_name">Hospital Name <span class="required">*</span></label>
        <input type="text" id="hospital_name" name="hospital_name" required placeholder="Enter hospital name">
      </div>

      <div class="form-group">
        <label for="hospital_id_license">Hospital ID / License Number</label>
        <input type="text" id="hospital_id_license" name="hospital_id_license" placeholder="Optional license or ID number">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="username">Username <span class="required">*</span></label>
          <input type="text" id="username" name="username" required placeholder="Choose a username">
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" required placeholder="Min. 6 characters">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Official Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" required placeholder="hospital@example.com">
      </div>

      <div class="form-group">
        <label for="contact_number">Contact Number</label>
        <input type="tel" id="contact_number" name="contact_number" placeholder="Phone number">
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address" placeholder="Street address"></textarea>
      </div>

      <div class="form-group">
        <label for="city">City</label>
        <input type="text" id="city" name="city" placeholder="City name">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        Submit Registration Request
      </button>
    </form>

    <a href="index.html" class="nav-link">← Back to Home</a>
  </div>

  <script>
    const form = document.getElementById("registrationForm");
    const alertEl = document.getElementById("alert");
    const submitBtn = document.getElementById("submitBtn");

    function showAlert(message, type) {
      alertEl.className = `alert alert-${type}`;
      alertEl.textContent = message;
      alertEl.style.display = "block";
      
      setTimeout(() => {
        alertEl.style.display = "none";
      }, 8000);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = {
        hospital_name: document.getElementById("hospital_name").value.trim(),
        hospital_id_license: document.getElementById("hospital_id_license").value.trim() || null,
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
        email: document.getElementById("email").value.trim(),
        contact_number: document.getElementById("contact_number").value.trim() || null,
        address: document.getElementById("address").value.trim() || null,
        city: document.getElementById("city").value.trim() || null
      };

      // Validate password length
      if (formData.password.length < 6) {
        showAlert("Password must be at least 6 characters long", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      try {
        const res = await fetch("http://localhost:5000/api/admin/register-request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData)
        });

        const data = await res.json();

        if (res.ok) {
          showAlert(data.msg, "success");
          form.reset();
          submitBtn.textContent = "Request Submitted Successfully!";
          setTimeout(() => {
            window.location.href = "login.html";
          }, 2000);
        } else {
          showAlert(data.msg || "Error submitting registration request", "error");
        }
      } catch (err) {
        console.error("Registration error:", err);
        showAlert("Error connecting to server. Please check if the backend is running.", "error");
      } finally {
        submitBtn.disabled = false;
        if (submitBtn.textContent === "Submitting...") {
          submitBtn.textContent = "Submit Registration Request";
        }
      }
    });
  </script>
</body>
</html>
