<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearby Hospitals</title>
<link rel="stylesheet" href="style.css">
<style>
body { 
  margin: 0; 
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f5f7fa;
}

.nav {
  background: white;
  padding: 18px 30px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.nav-content {
  max-width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav h1 {
  margin: 0;
  color: #3498db;
  font-size: 1.5em;
  font-weight: 600;
}

.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: #2c3e50;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s ease;
}

.nav-links a:hover {
  color: #3498db;
}

#map { 
  height: calc(100vh - 70px); 
  width: 100%; 
  border-top: 1px solid #e8eef3;
}

.loading-overlay {
  position: absolute;
  top: 70px;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(255, 255, 255, 0.97);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 999;
  font-size: 1.2em;
  color: #3498db;
}

.loading-overlay .spinner {
  border: 4px solid #e3f2fd;
  border-top: 4px solid #3498db;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loading-overlay.hidden {
  display: none;
}

/* Mobile responsive */
@media (max-width: 768px) {
  .nav {
    padding: 15px 20px;
  }
  
  .nav h1 {
    font-size: 1.2em;
  }
  
  .nav-links {
    gap: 15px;
  }
  
  .nav-links a {
    font-size: 0.9em;
  }
}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
<div class="nav">
  <div class="nav-content">
    <h1>📍 Nearby Hospitals</h1>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Staff Login</a>
    </div>
  </div>
</div>
<div id="loading" class="loading-overlay">
  <div class="spinner"></div>
  <div>Loading map and finding your location...</div>
  <div style="font-size: 0.8em; color: #666; margin-top: 10px;">Please allow location access when prompted</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="app.js"></script>
<script>
// Hide loading overlay when map is ready (handled in app.js)
</script>
</body>
</html>
