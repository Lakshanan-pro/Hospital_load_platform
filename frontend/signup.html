<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Registration Request</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  
  .container { 
    background: white; 
    padding: 40px; 
    border-radius: 15px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
    width: 100%;
    max-width: 500px;
  }
  
  h1 { 
    color: #333; 
    margin-bottom: 10px; 
    font-size: 2em;
    text-align: center;
  }
  
  .subtitle {
    color: #666;
    margin-bottom: 25px;
    font-size: 0.95em;
    text-align: center;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 600;
    font-size: 0.9em;
  }
  
  .required {
    color: #dc3545;
  }
  
  input { 
    width: 100%; 
    padding: 12px 15px; 
    border: 2px solid #e0e0e0;
    border-radius: 8px; 
    font-size: 1em;
    font-family: inherit;
    transition: border-color 0.3s;
  }
  
  input:focus {
    outline: none;
    border-color: #667eea;
  }
  
  button { 
    width: 100%;
    padding: 15px; 
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; 
    border: none; 
    border-radius: 8px; 
    cursor: pointer;
    font-size: 1.1em;
    font-weight: 600;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  
  button:hover:not(:disabled) { 
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
  }
  
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  
  a { 
    display: block; 
    margin-top: 15px; 
    color: #667eea; 
    text-decoration: none; 
    text-align: center;
    font-size: 0.9em;
  }
  
  a:hover { 
    text-decoration: underline; 
  }
  
  .alert {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 0.9em;
    display: none;
  }
  
  .alert-error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }
  
  .alert-success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
  
  .info-box {
    background: #e7f3ff;
    border: 1px solid #b3d9ff;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 20px;
    font-size: 0.85em;
    color: #004085;
  }
  
  .info-box strong {
    display: block;
    margin-bottom: 5px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🏥 Staff Registration</h1>
  <p class="subtitle">Request access to update hospital load data</p>
  
  <div class="info-box">
    <strong>ℹ️ Registration Process</strong>
    Your registration request will be reviewed by an administrator. You will be notified once your account is approved.
  </div>
  
  <div id="alert" class="alert"></div>
  
  <form id="signupForm">
    <div class="form-group">
      <label for="username">Username <span class="required">*</span></label>
      <input type="text" id="username" placeholder="Choose a username" required autocomplete="username">
    </div>
    
    <div class="form-group">
      <label for="hospitalName">Hospital Name <span class="required">*</span></label>
      <input type="text" id="hospitalName" placeholder="Enter exact hospital name" required>
      <small style="color: #666; font-size: 0.85em; display: block; margin-top: 5px;">Use the exact name as shown on the map</small>
    </div>
    
    <div class="form-group">
      <label for="password">Password <span class="required">*</span></label>
      <input type="password" id="password" placeholder="Minimum 6 characters" required autocomplete="new-password">
    </div>
    
    <div class="form-group">
      <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
      <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
    </div>
    
    <div class="form-group">
      <label for="email">Email <span class="required">*</span></label>
      <input type="email" id="email" placeholder="your.email@example.com" required autocomplete="email">
    </div>
    
    <div class="form-group">
      <label for="contactNumber">Contact Number</label>
      <input type="tel" id="contactNumber" placeholder="Optional phone number" autocomplete="tel">
    </div>
    
    <div class="form-group">
      <label for="hospitalIdLicense">Hospital ID / License</label>
      <input type="text" id="hospitalIdLicense" placeholder="Optional hospital license number">
    </div>
    
    <div class="form-group">
      <label for="city">City</label>
      <input type="text" id="city" placeholder="Optional city name">
    </div>
    
    <div class="form-group">
      <label for="address">Address</label>
      <input type="text" id="address" placeholder="Optional address">
    </div>
    
    <button type="submit" id="submitBtn">Submit Registration Request</button>
  </form>
  
  <a href="index.html">Already have an account? Login</a>
</div>

<script>
const form = document.getElementById("signupForm");
const submitBtn = document.getElementById("submitBtn");

function showAlert(message, type) {
  const alert = document.getElementById("alert");
  alert.className = `alert alert-${type}`;
  alert.textContent = message;
  alert.style.display = "block";
  
  setTimeout(() => {
    alert.style.display = "none";
  }, 5000);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  
  const username = document.getElementById("username").value.trim();
  const hospitalName = document.getElementById("hospitalName").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const email = document.getElementById("email").value.trim();
  const contactNumber = document.getElementById("contactNumber").value.trim();
  const hospitalIdLicense = document.getElementById("hospitalIdLicense").value.trim();
  const city = document.getElementById("city").value.trim();
  const address = document.getElementById("address").value.trim();

  if (password !== confirmPassword) {
    showAlert("Passwords do not match!", "error");
    return;
  }

  if (password.length < 6) {
    showAlert("Password must be at least 6 characters", "error");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  try {
    const res = await fetch("http://localhost:5000/api/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username,
        password,
        hospital_name: hospitalName,
        email,
        contact_number: contactNumber || null,
        hospital_id_license: hospitalIdLicense || null,
        city: city || null,
        address: address || null
      })
    });

    const data = await res.json();
    
    if (res.ok) {
      showAlert(data.msg, "success");
      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    } else {
      showAlert(data.msg || "Registration failed. Please try again.", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Registration Request";
    }
  } catch (err) {
    console.error("Signup error:", err);
    showAlert("Error connecting to server. Please check if the backend is running.", "error");
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Registration Request";
  }
});
</script>
</body>
</html>
